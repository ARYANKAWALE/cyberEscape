name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cyber-escape-room/package-lock.json
      - name: Install
        working-directory: cyber-escape-room
        run: npm ci
      - name: Build
        working-directory: cyber-escape-room
        env:
          VITE_BASE: /cyberEscape/
        run: npm run build
      - name: SPA fallback
        working-directory: cyber-escape-room
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cyber-escape-room/dist
      - id: deployment
        uses: actions/deploy-pages@v4
